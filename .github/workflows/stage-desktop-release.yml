name: Stage signed desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-stage-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require a desktop release tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run from a desktop-vX.Y.Z tag; dispatch it on the tag, or let the main-branch pipeline create one."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Verify release version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("apps/desktop/package.json"));
            const tauri = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json"));
            const adapter = JSON.parse(fs.readFileSync("apps/desktop/adapter.json"));
            const npmLock = JSON.parse(fs.readFileSync("package-lock.json")).packages["apps/desktop"]?.version;
            const cargo = fs.readFileSync("apps/desktop/src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
            const cargoLock = fs.readFileSync("apps/desktop/src-tauri/Cargo.lock", "utf8").match(/name = "cospace-desktop"\nversion = "([^"]+)"/)?.[1];
            if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || process.env.GITHUB_REF_NAME !== `desktop-v${pkg.version}` || [tauri.version, adapter.version, npmLock, cargo, cargoLock].some(version => version !== pkg.version)) throw Error("Desktop tag and version sources disagree");
          '
      - run: npm ci
      - run: npm run check

  package:
    needs: verify
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run prepare:tauri --workspace @cospace/desktop
      - run: npm run smoke --workspace @cospace/desktop
      - name: Build signed artifacts
        env:
          COSPACE_RELEASE: '1'
          COSPACE_UPDATER_PUBLIC_KEY: ${{ vars.COSPACE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node apps/desktop/scripts/build-tauri.mjs
      - run: node apps/desktop/scripts/package-release.mjs
      - name: Verify AppImage MCP launcher
        if: runner.os == 'Linux'
        run: node apps/desktop/scripts/smoke-appimage.mjs
      - name: Verify installed deb MCP launcher
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/releases/desktop/linux/*.deb
          node apps/desktop/scripts/smoke-appimage.mjs --deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cospace-desktop-${{ matrix.target }}
          path: dist/releases/desktop/**
          if-no-files-found: error

  publish:
    needs: package
    environment: desktop-release
    env:
      COSPACE_RELEASE_TARGETS: macos-arm64,linux-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist/desktop-release-input
          pattern: cospace-desktop-*
      - name: Build signature verifier
        run: cargo build --locked --release --manifest-path apps/desktop/tools/verify-update/Cargo.toml
      - name: Verify signatures and assemble release
        env:
          COSPACE_RELEASE: '1'
          COSPACE_UPDATER_PUBLIC_KEY: ${{ vars.COSPACE_UPDATER_PUBLIC_KEY }}
          COSPACE_VERIFY_UPDATE: ${{ github.workspace }}/apps/desktop/tools/verify-update/target/release/cospace-verify-update
        run: |
          node apps/desktop/scripts/assemble-release.mjs dist/desktop-release-input dist/desktop-release
          node apps/desktop/scripts/verify-release.mjs dist/desktop-release
      - name: Create or resume release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          title="CoSpace Desktop ${GITHUB_REF_NAME#desktop-v}"
          notes='Automated release: platform builds, smoke checks, SHA-256 checksums, and updater signatures passed. macOS is ad-hoc signed and not notarized.'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          fi
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for asset in dist/desktop-release/*; do
            name="$(basename "$asset")"
            if printf '%s\n' "$assets" | grep -Fxq "$name"; then
              echo "Release already contains $name."
            else
              gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
          expected="$(find dist/desktop-release -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)"
          while IFS= read -r name; do
            if ! printf '%s\n' "$actual" | grep -Fxq "$name"; then
              echo "::error::Published release is missing $name"
              exit 1
            fi
          done <<< "$expected"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

  promote:
    needs: publish
    name: Promote the verified update manifest
    environment: desktop-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_TAG: ${{ github.ref_name }}
      COSPACE_UPDATER_PUBLIC_KEY: ${{ vars.COSPACE_UPDATER_PUBLIC_KEY }}
      COSPACE_SUPPORTED_TARGETS: macos-arm64,linux-x64
      COSPACE_VERIFY_UPDATE: ${{ github.workspace }}/apps/desktop/tools/verify-update/target/release/cospace-verify-update
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - run: npm ci
      - name: Build the update verifier
        run: cargo build --locked --release --manifest-path apps/desktop/tools/verify-update/Cargo.toml
      - name: Verify release and prepare the supported update manifest
        run: node apps/desktop/scripts/prepare-promotion.mjs "$PROMOTION_TAG"
      - name: Confirm the npm package referenced by the site resolves
        run: npm view dsh-plugin-space version --silent
      - name: Commit and deploy the update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain -- apps/site/desktop/latest.json | grep -q .; then
            git add apps/site/desktop/latest.json
            git commit -m "chore(site): promote desktop ${PROMOTION_TAG#desktop-v}"
            git push origin HEAD:main
          else
            echo "The supported update manifest is already current."
          fi
          gh workflow run pages.yml --ref main
