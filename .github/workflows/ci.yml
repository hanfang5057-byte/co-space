name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'adapters/**'
      - 'apps/site/**'
      - 'assets/**'
      - 'packages/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'adapters/**'
      - 'apps/site/**'
      - 'assets/**'
      - 'packages/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:dsh-package
      - run: node scripts/sync-market.mjs --check
      - run: npm run build:site

  desktop-smoke:
    name: Desktop sidecar smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:tauri --workspace @cospace/desktop
      - run: npm run smoke --workspace @cospace/desktop
