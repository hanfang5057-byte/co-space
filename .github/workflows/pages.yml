name: Deploy site and plugin index

on:
  push:
    branches:
      - main
    paths:
      - 'apps/site/**'
      - 'apps/local-server/installer/**'
      - 'apps/local-server/skills/**'
      - 'assets/**'
      - 'docs/preview.svg'
      - 'market/**'
      - 'packages/brand/**'
      - 'scripts/build-site.mjs'
      - 'scripts/build-market.mjs'
      - 'scripts/sync-market.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npm run build:market
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/market
          cp -R dist/site/. _site/
          cp market/index.json _site/market/index.json
          cp -R market/icons _site/market/icons
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
